name: My First CV Workflow

on:
  push:

jobs:
  check-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          if [ -f index.html ]; then
            echo "CV file exists!"
          else
            echo "CV file is missing!"
            exit 1
          fi

      - name: Success message
        run: echo "My first GitHub Action works!"
